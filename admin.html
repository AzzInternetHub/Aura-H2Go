<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura H2Go | Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex items-center justify-center">

    <div id="login-box" class="w-full max-w-sm p-6 bg-slate-800 rounded-2xl border border-slate-700 space-y-4">
        <h1 class="text-xl font-bold text-center">Admin Access</h1>
        <input type="password" id="admin-pass" placeholder="Enter Admin Password" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-sm focus:outline-none">
        <button onclick="login()" class="w-full py-3 bg-sky-600 rounded-xl font-bold text-sm">Authenticate</button>
    </div>

    <div id="admin-panel" class="hidden w-full max-w-lg p-6 bg-slate-800 rounded-2xl border border-slate-700 space-y-6">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <h2 class="font-bold text-lg">System Dashboard</h2>
            <button onclick="location.reload()" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">Lock Session</button>
        </div>

        <div class="space-y-2">
            <p class="text-xs text-slate-400">Database Connection Status:</p>
            <div id="status-box" class="p-4 bg-slate-900 rounded-xl text-xs font-mono text-emerald-400">Ready</div>
        </div>

        <div class="space-y-2">
            <h3 class="text-sm font-bold">Quick Management Links</h3>
            <p class="text-xs text-slate-400">To modify rates or manage orders, open your linked Google Sheet backend:</p>
            <a href="https://sheets.google.com" target="_blank" class="block w-full py-3 bg-slate-700 text-center rounded-xl text-xs font-bold hover:bg-slate-600">Open Google Sheets Backend</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
